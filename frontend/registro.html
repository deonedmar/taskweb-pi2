<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskWeb — Cadastro</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-card">
    <h1 class="auth-logo">Task<span>Web</span></h1>
    <p class="auth-subtitulo">Crie sua conta gratuitamente</p>

    <form id="formRegistro" class="auth-form" novalidate>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Seu nome" autocomplete="name" required />
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required />
      </div>

      <div class="campo">
        <label for="senha">Senha <small>(mínimo 6 caracteres)</small></label>
        <input type="password" id="senha" placeholder="Crie uma senha" autocomplete="new-password" required minlength="6" />
      </div>

      <div class="campo">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" placeholder="Repita a senha" autocomplete="new-password" required />
      </div>

      <p id="msgErro" class="erro-msg" hidden></p>

      <button type="submit" id="btnCadastrar" class="btn-auth">Criar conta</button>
    </form>

    <p class="auth-link">
      Já tem conta? <a href="login.html">Entrar</a>
    </p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
