<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskWeb</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <div class="app">
      <main class="main" id="conteudo-principal" tabindex="-1">
        <header class="topbar">
          <h1 id="saudacao">Olá! <span aria-hidden="true">👋</span></h1>
          <strong class="brand">TaskWeb</strong>
          <button class="btn secondary" id="btn-sair" type="button">Sair</button>
        </header>

        <section class="cards" aria-labelledby="titulo-resumo">
          <h2 id="titulo-resumo" class="sr-only">Resumo das tarefas e filtro por status</h2>
          <button type="button" class="card blue ativo" data-filtro="todas" aria-pressed="true">
            <span class="card-titulo"><span aria-hidden="true">📋</span> Todas</span>
            <span class="card-numero" id="todas">0</span>
          </button>

          <button type="button" class="card green" data-filtro="concluida" aria-pressed="false">
            <span class="card-titulo"><span aria-hidden="true">✅</span> Concluídas</span>
            <span class="card-numero" id="concluidas">0</span>
          </button>

          <button type="button" class="card yellow" data-filtro="pendente" aria-pressed="false">
            <span class="card-titulo"><span aria-hidden="true">⏰</span> Em andamento</span>
            <span class="card-numero" id="andamento">0</span>
          </button>

          <button type="button" class="card red" data-filtro="atrasada" aria-pressed="false">
            <span class="card-titulo"><span aria-hidden="true">❌</span> Atrasadas</span>
            <span class="card-numero" id="atrasadas">0</span>
          </button>
        </section>

        <div class="filtros-bar">
          <div class="filtros-acoes">
            <a class="btn secondary" href="estatisticas.html"><span aria-hidden="true">📊</span> Estatísticas</a>
            <button class="btn" id="btn-nova-tarefa" type="button">+ Nova tarefa</button>
          </div>
        </div>

        <section class="tarefas">
          <div class="top-tarefas">
            <h2 id="titulo-tarefas" tabindex="-1">Minhas Tarefas</h2>
            <div class="tarefas-controles">
              <label for="ordenacao">Ordenar por</label>
              <select id="ordenacao">
                <option value="titulo">Tarefa</option>
                <option value="prioridade">Prioridade</option>
                <option value="criado_em">Data de criação</option>
                <option value="prazo">Prazo</option>
                <option value="status">Status</option>
              </select>
              <label for="busca" class="sr-only">Buscar tarefas pelo título</label>
              <input type="search" id="busca" placeholder="Buscar...">
            </div>
          </div>

          <table>
            <caption class="sr-only">Lista de tarefas</caption>
            <thead>
              <tr>
                <th scope="col">Tarefa</th>
                <th scope="col">Prioridade</th>
                <th scope="col">Criada em</th>
                <th scope="col">Prazo</th>
                <th scope="col">Status</th>
                <th scope="col">Detalhes</th>
                <th scope="col">Ação</th>
              </tr>
            </thead>
            <tbody id="lista-tarefas"></tbody>
          </table>

          <div class="tarefas-cards" id="lista-tarefas-cards"></div>

          <p class="mensagem" id="mensagem" role="status"></p>
          <p class="sr-only" id="anuncio-lista" role="status" aria-live="polite" aria-atomic="true"></p>
        </section>
      </main>
    </div>

    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <h2 id="modal-titulo">Nova Tarefa</h2>

        <form id="form-tarefa">
          <label for="titulo" class="sr-only">Título da tarefa (obrigatório)</label>
          <input type="text" id="titulo" placeholder="Título da tarefa" required aria-required="true">
          <label for="descricao" class="sr-only">Detalhes da tarefa (opcional)</label>
          <textarea id="descricao" placeholder="Detalhes (opcional)" rows="4"></textarea>
          <label for="prazo" class="sr-only">Prazo da tarefa</label>
          <input type="date" id="prazo">

          <label for="prioridade" class="sr-only">Prioridade da tarefa</label>
          <select id="prioridade">
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
          </select>

          <div class="modal-actions">
            <button class="btn" id="btn-salvar-tarefa" type="submit">Criar tarefa</button>
            <button class="btn secondary" id="btn-cancelar" type="button">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div id="modal-detalhes" class="modal" aria-hidden="true">
      <div class="modal-content detalhes-content" role="dialog" aria-modal="true" aria-labelledby="detalhes-titulo" aria-describedby="detalhes-meta detalhes-texto">
        <h2 id="detalhes-titulo" tabindex="-1">Detalhes da Tarefa</h2>
        <p class="detalhes-meta" id="detalhes-meta"></p>
        <p class="detalhes-texto" id="detalhes-texto"></p>
        <button class="btn secondary" id="btn-fechar-detalhes" type="button">Fechar</button>
      </div>
    </div>

    <div id="modal-confirmar" class="modal" aria-hidden="true">
      <div class="modal-content" role="alertdialog" aria-modal="true" aria-labelledby="confirmar-titulo" aria-describedby="confirmar-texto">
        <h2 id="confirmar-titulo">Confirmar ação</h2>
        <p id="confirmar-texto" style="margin: 12px 0 20px; color: #444;"></p>
        <div class="modal-actions">
          <button class="btn" id="btn-confirmar-sim" type="button">Confirmar</button>
          <button class="btn secondary" id="btn-confirmar-nao" type="button">Cancelar</button>
        </div>
      </div>
    </div>

    <div id="modal-foco" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="foco-modal-titulo">
        <h2 id="foco-modal-titulo">Iniciar foco</h2>
        <p id="foco-modal-tarefa" style="margin: 8px 0 14px; color: #444;"></p>
        <label for="foco-preset">Ritmo de foco e pausa</label>
        <select id="foco-preset">
          <option value="pomodoro">25 min de foco + 5 min de pausa</option>
          <option value="longo">50 min de foco + 10 min de pausa</option>
          <option value="curto">15 min de foco + 3 min de pausa</option>
        </select>
        <div class="modal-actions">
          <button class="btn" id="btn-foco-iniciar" type="button">Iniciar</button>
          <button class="btn secondary" id="btn-foco-cancelar" type="button">Cancelar</button>
        </div>
      </div>
    </div>

    <section id="painel-foco" class="painel-foco" aria-label="Cronômetro de foco" hidden>
      <div class="foco-barra" aria-hidden="true"><span id="foco-progresso"></span></div>
      <div class="foco-linha">
        <div class="foco-info">
          <span id="foco-modo" class="foco-modo">Foco</span>
          <span id="foco-tarefa" class="foco-tarefa"></span>
        </div>
        <div id="foco-tempo" class="foco-tempo" role="timer" aria-label="Tempo restante">25:00</div>
        <div class="foco-botoes">
          <button type="button" id="btn-foco-pausar" class="principal">Pausar</button>
          <button type="button" id="btn-foco-pular">Ir para a pausa</button>
          <button type="button" id="btn-foco-parar">Parar</button>
          <button type="button" id="btn-foco-falar">Ouvir tempo</button>
        </div>
      </div>
    </section>
    <div id="anuncio-foco" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="alerta-foco" class="sr-only" role="alert" aria-atomic="true"></div>

    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
    <script src="./foco.js"></script>
    <script src="./fogos.js"></script>
  </body>
</html>
